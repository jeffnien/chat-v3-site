    <p>國立臺灣藝術大學魔術社（NTUA MAGIC）不只是學習魔術技巧的地方，也是一個跨域創作的實驗場域。我們鼓勵不同藝術領域的夥伴，把戲劇、視覺設計、肢體動作與多媒體等專長帶進魔術，一起發展屬於臺藝大的表演風格。</p>
